{# partials/sidebar.html — sidebar without user card and without My Profile #}
<aside class="sidebar" id="sidebar">

  <!-- Brand -->
  <div class="sb-brand">
    <img src="{{ url_for('static', filename='images/Vita_pulse.png') }}" alt="VitaPulse" class="sb-logo"/>
    <span class="sb-title">VITAPULSE</span>
    <button class="sb-close" id="sbClose" aria-label="Close"><i data-lucide="x"></i></button>
  </div>

  <!-- Navigation -->
  <nav class="sb-nav" aria-label="Main navigation">
    <p class="sb-section-lbl">Overview</p>

    <a href="{{ url_for('dashboard.index') }}"
       class="sb-link {% if request.endpoint == 'dashboard.index' %}active{% endif %}">
      <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
    </a>

    {# ========== ALL OTHER LINKS ARE COMMENTED OUT ========== #}
    {#
    <a href="{{ url_for('profile.profile') }}" class="sb-link">...</a>
    <p class="sb-section-lbl">Health & Fitness</p>
    ...
    #}
  </nav>

  <!-- Logout -->
  <div class="sb-foot">
    <a href="{{ url_for('auth.logout') }}" class="sb-logout">
      <i data-lucide="log-out"></i><span>Logout</span>
    </a>
  </div>
</aside>

<div class="sb-overlay" id="sbOverlay"></div>
